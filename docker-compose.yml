version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: hf_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hf_datasets}
      - MYSQL_USER=${MYSQL_USER:-hfuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-hfpassword}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hf_rabbitmq
    ports:
      - "5672:5672"  # AMQP 端口
      - "15672:15672"  # 管理界面端口
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-password123}
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # RabbitMQ 生产者服务
  rabbitmq-producer:
    build:
      context: .
      dockerfile: Dockerfile.rabbitmq-producer
    container_name: hf_rabbitmq_producer
    environment:
      # MySQL 配置
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-hfuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-hfpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hf_datasets}
      # RabbitMQ 配置
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-password123}
      - RABBITMQ_VHOST=/
      - RABBITMQ_QUEUE_NAME=hf_download_queue
      - RABBITMQ_DLQ_NAME=hf_download_dlq
      - RABBITMQ_EVENT_EXCHANGE=download_events
      - RABBITMQ_EVENT_QUEUE=producer_events
      # HuggingFace 配置
      - HF_ENDPOINT=${HF_ENDPOINT:-https://huggingface.co}
      - HF_TOKEN=${HF_TOKEN}
      # 生产者配置
      - PRODUCER_INTERVAL=${PRODUCER_INTERVAL:-3600}
      - PRODUCER_DAYS=${PRODUCER_DAYS:-7}
      - PRODUCER_LIMIT=${PRODUCER_LIMIT:-2}
      - PRODUCER_TIMEZONE_OFFSET=${PRODUCER_TIMEZONE_OFFSET:-8}
      - PRODUCER_USE_CREATED_AT=${PRODUCER_USE_CREATED_AT:-false}
      - PRODUCER_AUTO_LIMIT=${PRODUCER_AUTO_LIMIT:-true}
      # SQLite 配置
      - SQLITE_DB_PATH=/app/data/datasets.db
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./Data-discover:/app/Data-discover
      - producer_data:/app/data
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  # RabbitMQ 消费者服务
  rabbitmq-consumer:
    build:
      context: .
      dockerfile: Dockerfile.rabbitmq-consumer
    environment:
      # RabbitMQ 配置
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-password123}
      - RABBITMQ_VHOST=/
      - RABBITMQ_QUEUE_NAME=hf_download_queue
      - RABBITMQ_DLQ_NAME=hf_download_dlq
      - RABBITMQ_EVENT_EXCHANGE=download_events
      # HuggingFace 配置
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_TOKEN=${HF_TOKEN}
      # 消费者配置
      - CONSUMER_WORKERS=${CONSUMER_WORKERS:-1}
      - CONSUMER_MAX_RETRIES=${CONSUMER_MAX_RETRIES:-3}
      - CONSUMER_TIMEOUT=${CONSUMER_TIMEOUT:-3600}
      - OUTPUT_DIR=/datasets
      - GO_BINARY_PATH=/usr/local/bin/hfdownloader
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./Data-discover:/app/Data-discover
      - type: volume
        source: cifs-datasets
        target: /datasets
        volume:
          nocopy: true
    user: "0:0"  # 以 root 运行以获得写入权限
    restart: unless-stopped
    deploy:
      replicas: ${CONSUMER_REPLICAS:-1}

  # 监控服务（兼容 RabbitMQ）
  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: hf_monitor
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-password123}
      - MONITOR_HOST=0.0.0.0
      - MONITOR_PORT=8080
    depends_on:
      - rabbitmq
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql_data:
  rabbitmq_data:
  producer_data:
  cifs-datasets:
    driver: local
    driver_opts:
      type: cifs
      device: "//158.132.113.88/infixai/Max"
      o: "addr=158.132.113.88,username=${SMB_USERNAME},password=${SMB_PASSWORD},rw"

networks:
  default:
    name: hf_downloader_network