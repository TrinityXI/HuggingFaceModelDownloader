version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: hf_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hf_datasets}
      - MYSQL_USER=${MYSQL_USER:-hfuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-hfpassword}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Redis 缓存和配置存储
  redis:
    image: redis:7-alpine
    container_name: hf_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hf_rabbitmq
    ports:
      - "5672:5672"  # AMQP 端口
      - "15672:15672"  # 管理界面端口
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-password123}
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ../config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Backend 服务 (Producer + API)
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: hf_backend
    environment:
      # HTTP API 配置
      - PRODUCER_HOST=0.0.0.0
      - PRODUCER_PORT=8000

      # MySQL 配置
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-hfuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-hfpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-hf_datasets}

      # Redis 配置
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_CONFIG_KEY=hf_producer_config

      # RabbitMQ 配置
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-password123}
      - RABBITMQ_VHOST=/
      - RABBITMQ_QUEUE_NAME=hf_download_queue
      - RABBITMQ_DLQ_NAME=hf_download_dlq
      - RABBITMQ_EVENT_EXCHANGE=download_events
      - RABBITMQ_EVENT_QUEUE=producer_events

      # HuggingFace 配置
      - HF_ENDPOINT=${HF_ENDPOINT:-https://huggingface.co}
      - HF_TOKEN=${HF_TOKEN}

      # 生产者配置
      - PRODUCER_INTERVAL=${PRODUCER_INTERVAL:-3600}
      - PRODUCER_DAYS=${PRODUCER_DAYS:-7}
      - PRODUCER_LIMIT=${PRODUCER_LIMIT:-50}
      - PRODUCER_TIMEZONE_OFFSET=${PRODUCER_TIMEZONE_OFFSET:-8}
      - PRODUCER_USE_CREATED_AT=${PRODUCER_USE_CREATED_AT:-false}
      - PRODUCER_AUTO_LIMIT=${PRODUCER_AUTO_LIMIT:-true}

      # 飞书机器人配置 (可选)
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - FEISHU_ENCRYPT_KEY=${FEISHU_ENCRYPT_KEY:-}
      - FEISHU_VERIFICATION_TOKEN=${FEISHU_VERIFICATION_TOKEN:-}

      # LLM Agent 配置
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://llm.infix-ai.xyz/chat/completions}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2000}
      - AGENT_ENABLED=${AGENT_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - producer_data:/app/data
    ports:
      - "80:8000"  # HTTP API 端口
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Frontend 服务 (Next.js UI)
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
    container_name: hf_frontend
    environment:
      # 指向 backend 服务的 API 地址 (用于 Next.js rewrite)
      - API_PROXY_URL=http://backend:8000/api/:path*
    depends_on:
      - backend
    ports:
      - "3000:3000"  # UI 端口
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  mysql_data:
  rabbitmq_data:
  redis_data:
  producer_data:
  cifs-datasets:
    driver: local
    driver_opts:
      type: cifs
      device: "//158.132.113.88/infixai/Max"
      o: "addr=158.132.113.88,username=${SMB_USERNAME},password=${SMB_PASSWORD},rw"

networks:
  default:
    name: hf_downloader_network
