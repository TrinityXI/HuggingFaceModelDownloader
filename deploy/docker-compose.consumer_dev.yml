version: '3.8'

services:
  # HTTP Consumer 服务
  http-consumer:
    build:
      context: .
      dockerfile: Dockerfile.http-consumer
    environment:
      # Producer API 配置
      - PRODUCER_ENDPOINT=http://localhost:8000
      - WORKER_ID=http-consumer-1
      - POLL_INTERVAL=30

      # Consumer 配置
      - CONSUMER_WORKERS=1
      - CONSUMER_MAX_RETRIES=3
      - CONSUMER_TIMEOUT=3600

      # 下载器配置
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_TOKEN=${HF_TOKEN:-}
      - OUTPUT_DIR=/datasets
      - GO_BINARY_PATH=/usr/local/bin/hfdownloader
    volumes:
      - ./datasets:/datasets
    user: "0:0"  # 以 root 运行以获得写入权限
    restart: unless-stopped
    deploy:
      replicas: ${CONSUMER_REPLICAS:-1}

networks:
  default:
    name: hf_network