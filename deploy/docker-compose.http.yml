version: '3.8'

services:
  # HTTP Consumer 服务
  http-consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.http-consumer
    environment:
      # Producer API 配置
      - PRODUCER_ENDPOINT=${PRODUCER_ENDPOINT:-http://host.docker.internal:8000}
      - WORKER_ID=http-consumer-1
      - POLL_INTERVAL=30

      # Consumer 配置
      - CONSUMER_WORKERS=1
      - CONSUMER_MAX_RETRIES=3
      - CONSUMER_TIMEOUT=3600

      # 下载器配置
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - HF_TOKEN=${HF_TOKEN}
      - OUTPUT_DIR=/datasets
      - GO_BINARY_PATH=/usr/local/bin/hfdownloader
    volumes:
      - type: volume
        source: cifs-datasets
        target: /datasets
        volume:
          nocopy: true
      # Add tmpfs volume for temporary .part files to prevent disk bloat
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 2G  # 2GB tmpfs for temp files
    user: "0:0"  # 以 root 运行以获得写入权限
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      replicas: ${CONSUMER_REPLICAS:-1}
      resources:
        limits:
          memory: 4G  # Limit memory to prevent container bloat
        reservations:
          memory: 512M

volumes:
  cifs-datasets:
    driver: local
    driver_opts:
      type: cifs
      device: "//158.132.113.88/infixai/datasets"
      o: "addr=158.132.113.88,username=${SMB_USERNAME},password=${SMB_PASSWORD},rw"

