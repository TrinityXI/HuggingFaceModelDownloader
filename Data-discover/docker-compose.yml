version: '3.8'

services:
  # 生产者服务：定期扫描 HF 数据集并添加到队列
  producer:
    build:
      context: .
      dockerfile: Dockerfile.redis-producer
      args:
        TARGETOS: linux
        TARGETARCH: amd64
    image: hf-producer:latest-amd64
    container_name: hf-producer
    volumes:
      - ./datasets.db:/app/datasets.db
      - ./logs:/app/logs
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - PRODUCER_DAYS=${PRODUCER_DAYS:-7}
      - PRODUCER_LIMIT=${PRODUCER_LIMIT:-2}
      - PRODUCER_INTERVAL=${PRODUCER_INTERVAL:-10}
      - PRODUCER_ENDPOINT=${PRODUCER_ENDPOINT:-https://hf-mirror.com}
      - PRODUCER_DB=datasets.db
    restart: unless-stopped
    networks:
      - hf-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; conn = sqlite3.connect('datasets.db'); conn.close()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 消费者服务：从队列读取任务并调用 Docker 下载器
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.persistent-consumer
      args:
        TARGETOS: linux
        TARGETARCH: amd64
    image: hf-consumer:latest-amd64
    container_name: hf-consumer
    user: root  # 临时使用 root 用户以访问 Docker socket（生产环境应修复权限）
    volumes:
      - ../Datasets:/data
      - ./datasets.db:/app/datasets.db
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock  # 需要访问 Docker daemon
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - CONSUMER_DB=datasets.db
      - CONSUMER_OUTPUT=/data
      - CONSUMER_DOCKER_IMAGE=${CONSUMER_DOCKER_IMAGE:-huggingface-downloader:latest-amd64}
      - CONSUMER_ENDPOINT=${CONSUMER_ENDPOINT:-https://hf-mirror.com}
      - CONSUMER_WORKERS=${CONSUMER_WORKERS:-1}
      - CONSUMER_MAX_ACTIVE=${CONSUMER_MAX_ACTIVE:-2}
      - CONSUMER_CONNECTIONS=${CONSUMER_CONNECTIONS:-4}
      - CONSUMER_DRY_RUN=true
    restart: unless-stopped
    depends_on:
      producer:
        condition: service_started
    networks:
      - hf-network
    # 注意：消费者需要能够调用 Docker，需要挂载 Docker socket

networks:
  hf-network:
    driver: bridge

